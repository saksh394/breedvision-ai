<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BreedVision AI — Image-Based Breed Recognition for Cattle &amp; Buffaloes of India</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .badge-pending { background-color: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .badge-verified { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .badge-corrected { background-color: #ccfbf1; color: #115e59; border: 1px solid #99f6e4; }
    .badge-under-review { background-color: #f3e8ff; color: #6b21a8; border: 1px solid #e9d5ff; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Mock Data & Storage ---
    const SAMPLE_IMAGES = {
      gir: "https://images.unsplash.com/photo-1546445317-29f4545e9d53?w=600&auto=format&fit=crop&q=80",
      sahiwal: "https://images.unsplash.com/photo-1570042225831-d98fa7577f1e?w=600&auto=format&fit=crop&q=80",
      murrah: "https://images.unsplash.com/photo-1527153857715-3908f2ae5e81?w=600&auto=format&fit=crop&q=80",
      hf: "https://images.unsplash.com/photo-1500595046743-cd271d694d30?w=600&auto=format&fit=crop&q=80",
      jaffarabadi: "https://images.unsplash.com/photo-1560807707-8cc77767d783?w=600&auto=format&fit=crop&q=80"
    };

    const INITIAL_USERS = [
      { id: 'u1', name: 'Ramesh Patel', email: 'ramesh@example.com', role: 'user', status: 'Active' },
      { id: 'u2', name: 'Dr. Sunita Sharma', email: 'flw@example.com', role: 'flw', status: 'Active' },
      { id: 'u3', name: 'System Admin', email: 'admin@breedvision.ai', role: 'admin', status: 'Active' }
    ];

    const INITIAL_ANALYSES = [
      {
        id: 'ana-101',
        userId: 'u1',
        userName: 'Ramesh Patel',
        imageUrl: SAMPLE_IMAGES.gir,
        animalType: 'Cattle',
        predictedBreed: 'Gir',
        confidence: 78,
        top3Predictions: [
          { breed: 'Gir', confidence: 78 },
          { breed: 'Sahiwal', confidence: 15 },
          { breed: 'HF', confidence: 7 }
        ],
        breedStatus: 'Pure',
        status: 'Verified',
        flwResult: 'Gir',
        flwComment: 'Characteristic convex forehead and pendulous ears clearly observed.',
        verifiedDate: '26/09/2026',
        date: '26/09/2026'
      },
      {
        id: 'ana-102',
        userId: 'u1',
        userName: 'Ramesh Patel',
        imageUrl: SAMPLE_IMAGES.murrah,
        animalType: 'Buffalo',
        predictedBreed: 'Murrah',
        confidence: 84,
        top3Predictions: [
          { breed: 'Murrah', confidence: 84 },
          { breed: 'Jaffarabadi', confidence: 11 },
          { breed: 'Surti', confidence: 5 }
        ],
        breedStatus: 'Pure',
        status: 'Pending',
        flwResult: null,
        flwComment: null,
        verifiedDate: null,
        date: '25/09/2026'
      },
      {
        id: 'ana-103',
        userId: 'u1',
        userName: 'Ramesh Patel',
        imageUrl: SAMPLE_IMAGES.sahiwal,
        animalType: 'Cattle',
        predictedBreed: 'Gir',
        confidence: 65,
        top3Predictions: [
          { breed: 'Gir', confidence: 65 },
          { breed: 'Sahiwal', confidence: 25 },
          { breed: 'Red Sindhi', confidence: 10 }
        ],
        breedStatus: 'Crossbreed',
        status: 'Corrected',
        flwResult: 'Sahiwal',
        flwComment: 'Dewlap structure and horn shape match Sahiwal characteristics rather than Gir.',
        verifiedDate: '24/09/2026',
        date: '23/09/2026'
      }
    ];

    const INDIAN_BREEDS = [
      'Gir', 'Sahiwal', 'Red Sindhi', 'Tharparkar', 'Kankrej', 'Rathi', 'Hariana', 'Ongole',
      'Holstein Friesian (HF)', 'Jersey', 'Murrah', 'Jaffarabadi', 'Surti', 'Mehsana', 'Nili-Ravi'
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(INITIAL_USERS[0]); // Default logged in as User
      const [currentRoute, setCurrentRoute] = useState('user/home');
      const [analyses, setAnalyses] = useState(INITIAL_ANALYSES);
      const [selectedAnalysisId, setSelectedAnalysisId] = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      // Actions
      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setCurrentRoute('login');
      };

      const handleLogin = (role) => {
        const found = INITIAL_USERS.find(u => u.role === role);
        setCurrentUser(found || INITIAL_USERS[0]);
        if (role === 'admin') setCurrentRoute('admin/home');
        else if (role === 'flw') setCurrentRoute('flw/home');
        else setCurrentRoute('user/home');
      };

      const navigate = (route, id = null) => {
        if (id) setSelectedAnalysisId(id);
        setCurrentRoute(route);
        setSidebarOpen(false);
        window.scrollTo(0, 0);
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-5 right-5 z-50 bg-emerald-700 text-white px-4 py-3 rounded-lg shadow-lg text-sm font-medium animate-bounce">
              {toastMsg}
            </div>
          )}

          {/* If Not Logged In, Render Auth Screen */}
          {!currentUser ? (
            <LoginScreen onLogin={handleLogin} />
          ) : (
            <div className="flex-1 flex">
              {/* Sidebar */}
              <aside className={`fixed inset-y-0 left-0 z-40 w-64 bg-emerald-900 text-white flex flex-col transition-transform duration-200 lg:translate-x-0 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                <div className="h-16 px-5 flex items-center justify-between border-b border-emerald-800/60">
                  <div className="flex items-center space-x-2.5">
                    <div className="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center text-white font-bold text-xs border border-emerald-500 shadow-sm">
                      BV
                    </div>
                    <div>
                      <div className="font-bold text-base tracking-tight">BreedVision AI</div>
                      <div className="text-[10px] text-emerald-300 uppercase tracking-wider font-semibold">
                        {currentUser.role === 'admin' ? 'Admin Portal' : currentUser.role === 'flw' ? 'Field Worker' : 'User Portal'}
                      </div>
                    </div>
                  </div>
                  <button onClick={() => setSidebarOpen(false)} className="lg:hidden text-emerald-300 hover:text-white">✕</button>
                </div>

                <div className="flex-1 py-4 px-3 space-y-1">
                  {currentUser.role === 'user' && (
                    <>
                      <SidebarLink label="Home" active={currentRoute === 'user/home'} onClick={() => navigate('user/home')} />
                      <SidebarLink label="Upload Image" active={currentRoute === 'user/upload'} onClick={() => navigate('user/upload')} />
                      <SidebarLink label="History" active={currentRoute === 'user/history'} onClick={() => navigate('user/history')} />
                      <SidebarLink label="Profile" active={currentRoute === 'user/profile'} onClick={() => navigate('user/profile')} />
                    </>
                  )}
                  {currentUser.role === 'flw' && (
                    <>
                      <SidebarLink label="Home" active={currentRoute === 'flw/home'} onClick={() => navigate('flw/home')} />
                      <SidebarLink label="Pending Reviews" active={currentRoute === 'flw/pending'} onClick={() => navigate('flw/pending')} />
                      <SidebarLink label="Verified" active={currentRoute === 'flw/verified'} onClick={() => navigate('flw/verified')} />
                      <SidebarLink label="History" active={currentRoute === 'flw/history'} onClick={() => navigate('flw/history')} />
                      <SidebarLink label="Feedback" active={currentRoute === 'flw/feedback'} onClick={() => navigate('flw/feedback')} />
                      <SidebarLink label="Profile" active={currentRoute === 'flw/profile'} onClick={() => navigate('flw/profile')} />
                    </>
                  )}
                  {currentUser.role === 'admin' && (
                    <>
                      <SidebarLink label="Home" active={currentRoute === 'admin/home'} onClick={() => navigate('admin/home')} />
                      <SidebarLink label="Users" active={currentRoute === 'admin/users'} onClick={() => navigate('admin/users')} />
                      <SidebarLink label="Dataset / Images" active={currentRoute === 'admin/dataset'} onClick={() => navigate('admin/dataset')} />
                      <SidebarLink label="Model Testing" active={currentRoute === 'admin/model-testing'} onClick={() => navigate('admin/model-testing')} />
                      <SidebarLink label="Feedback" active={currentRoute === 'admin/feedback'} onClick={() => navigate('admin/feedback')} />
                      <SidebarLink label="Reports" active={currentRoute === 'admin/reports'} onClick={() => navigate('admin/reports')} />
                      <SidebarLink label="Profile" active={currentRoute === 'admin/profile'} onClick={() => navigate('admin/profile')} />
                    </>
                  )}
                </div>

                <div className="p-4 border-t border-emerald-800/60 bg-emerald-950/40">
                  <div className="flex items-center space-x-2.5 mb-2.5">
                    <div className={`w-7 h-7 rounded-full font-bold flex items-center justify-center text-xs border ${
                      currentUser.role === 'admin' ? 'bg-purple-100 text-purple-800 border-purple-300' :
                      currentUser.role === 'flw' ? 'bg-teal-100 text-teal-800 border-teal-300' :
                      'bg-emerald-100 text-emerald-800 border-emerald-300'
                    }`}>
                      {currentUser.name ? currentUser.name.charAt(0).toUpperCase() : (currentUser.role ? currentUser.role.charAt(0).toUpperCase() : 'U')}
                    </div>
                    <div>
                      <div className="text-xs font-semibold">{currentUser.name}</div>
                      <div className="text-[10px] text-emerald-300 uppercase tracking-wider font-medium">{currentUser.role}</div>
                    </div>
                  </div>
                  <button onClick={handleLogout} className="w-full bg-emerald-800/80 hover:bg-red-700 text-white text-xs font-medium py-1.5 rounded transition">
                    Logout
                  </button>
                </div>
              </aside>

              {/* Main Content Pane */}
              <div className="flex-1 flex flex-col min-w-0 lg:pl-64">
                <header className="h-16 bg-white border-b border-slate-200 px-4 sm:px-6 flex items-center justify-between sticky top-0 z-30">
                  <div className="flex items-center space-x-3">
                    <button onClick={() => setSidebarOpen(true)} className="lg:hidden p-2 rounded text-slate-600 hover:bg-slate-100">☰</button>
                    <div>
                      <span className="font-bold text-slate-900 tracking-tight text-lg">BreedVision AI</span>
                      <span className={`ml-2 px-2 py-0.5 rounded text-[11px] font-semibold uppercase tracking-wider ${
                        currentUser.role === 'admin' ? 'bg-purple-100 text-purple-800' :
                        currentUser.role === 'flw' ? 'bg-teal-100 text-teal-800' :
                        'bg-emerald-100 text-emerald-800'
                      }`}>
                        {currentUser.role}
                      </span>
                    </div>
                  </div>

                  {/* Header User Indicator & Switch Role Quick Tester */}
                  <div className="flex items-center space-x-4">
                    <div className="flex items-center space-x-2">
                      <span className="text-xs text-slate-500 hidden sm:inline">Switch Role:</span>
                      <button onClick={() => handleLogin('user')} className={`text-xs px-2 py-1 rounded border ${currentUser.role === 'user' ? 'bg-emerald-600 text-white' : 'bg-white text-slate-700'}`}>User</button>
                      <button onClick={() => handleLogin('flw')} className={`text-xs px-2 py-1 rounded border ${currentUser.role === 'flw' ? 'bg-teal-600 text-white' : 'bg-white text-slate-700'}`}>FLW</button>
                      <button onClick={() => handleLogin('admin')} className={`text-xs px-2 py-1 rounded border ${currentUser.role === 'admin' ? 'bg-purple-600 text-white' : 'bg-white text-slate-700'}`}>Admin</button>
                    </div>

                    <div className="flex items-center space-x-2.5 pl-3 border-l border-slate-200">
                      <div className="text-sm font-semibold text-slate-900 hidden sm:block">{currentUser.name}</div>
                      <div className={`w-8 h-8 rounded-full font-bold flex items-center justify-center text-xs border ${
                        currentUser.role === 'admin' ? 'bg-purple-100 text-purple-800 border-purple-300' :
                        currentUser.role === 'flw' ? 'bg-teal-100 text-teal-800 border-teal-300' :
                        'bg-emerald-100 text-emerald-800 border-emerald-300'
                      }`}>
                        {currentUser.name ? currentUser.name.charAt(0).toUpperCase() : (currentUser.role ? currentUser.role.charAt(0).toUpperCase() : 'U')}
                      </div>
                    </div>
                  </div>
                </header>

                <main className="flex-1 p-4 sm:p-6 lg:p-8">
                  {/* USER ROUTES */}
                  {currentRoute === 'user/home' && <UserHomeScreen analyses={analyses} onNavigate={navigate} />}
                  {currentRoute === 'user/upload' && <UserUploadScreen onNavigate={navigate} setAnalyses={setAnalyses} showToast={showToast} analyses={analyses} />}
                  {currentRoute === 'user/result' && <UserResultScreen analysisId={selectedAnalysisId} analyses={analyses} onNavigate={navigate} showToast={showToast} />}
                  {currentRoute === 'user/gradcam' && <GradCamScreen analysisId={selectedAnalysisId} analyses={analyses} onBack={() => navigate(currentUser.role === 'flw' ? 'flw/review' : 'user/result', selectedAnalysisId)} />}
                  {currentRoute === 'user/history' && <UserHistoryScreen analyses={analyses} setAnalyses={setAnalyses} onNavigate={navigate} showToast={showToast} />}
                  {currentRoute === 'user/profile' && <ProfileScreen user={currentUser} showToast={showToast} />}

                  {/* FLW ROUTES */}
                  {currentRoute === 'flw/home' && <FlwHomeScreen analyses={analyses} onNavigate={navigate} />}
                  {currentRoute === 'flw/pending' && <FlwPendingScreen analyses={analyses} onNavigate={navigate} />}
                  {currentRoute === 'flw/review' && <FlwReviewScreen analysisId={selectedAnalysisId} analyses={analyses} setAnalyses={setAnalyses} onNavigate={navigate} showToast={showToast} />}
                  {currentRoute === 'flw/verified' && <FlwVerifiedScreen analyses={analyses} onNavigate={navigate} />}
                  {currentRoute === 'flw/history' && <FlwHistoryScreen analyses={analyses} onNavigate={navigate} />}
                  {currentRoute === 'flw/feedback' && <FlwFeedbackScreen analyses={analyses} />}
                  {currentRoute === 'flw/profile' && <ProfileScreen user={currentUser} showToast={showToast} />}

                  {/* ADMIN ROUTES */}
                  {currentRoute === 'admin/home' && <AdminHomeScreen analyses={analyses} onNavigate={navigate} />}
                  {currentRoute === 'admin/users' && <AdminUsersScreen users={INITIAL_USERS} showToast={showToast} />}
                  {currentRoute === 'admin/dataset' && <AdminDatasetScreen showToast={showToast} />}
                  {currentRoute === 'admin/model-testing' && <AdminModelTestingScreen />}
                  {currentRoute === 'admin/feedback' && <AdminFeedbackScreen analyses={analyses} />}
                  {currentRoute === 'admin/reports' && <AdminReportsScreen analyses={analyses} />}
                  {currentRoute === 'admin/profile' && <ProfileScreen user={currentUser} showToast={showToast} />}
                </main>
              </div>
            </div>
          )}
        </div>
      );
    }

    function SidebarLink({ label, active, onClick, icon }) {
      return (
        <button
          onClick={onClick}
          className={`w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition ${
            active ? 'bg-emerald-700 text-white font-semibold shadow-xs' : 'text-emerald-100 hover:bg-emerald-800/60 hover:text-white'
          }`}
        >
          <span>{icon}</span>
          <span>{label}</span>
        </button>
      );
    }

    // --- SCREEN: LOGIN ---
    function LoginScreen({ onLogin }) {
      const [role, setRole] = useState('user');
      const [email, setEmail] = useState('ramesh@example.com');
      const [password, setPassword] = useState('password123');

      const handleSelectRole = (r) => {
        setRole(r);
        if (r === 'admin') setEmail('admin@breedvision.ai');
        else if (r === 'flw') setEmail('flw@example.com');
        else setEmail('ramesh@example.com');
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-slate-50">
          <div className="bg-white border border-slate-200 rounded-xl p-8 max-w-md w-full shadow-xs">
            <div className="text-center mb-6">
              <div className="text-4xl mb-2">🐮</div>
              <h1 className="text-2xl font-bold text-slate-900 tracking-tight">BreedVision AI</h1>
              <p className="text-xs text-slate-500 mt-1">Image-Based Breed Recognition for Cattle &amp; Buffaloes of India</p>
            </div>

            <form onSubmit={(e) => { e.preventDefault(); onLogin(role); }} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Email / Username</label>
                <input type="text" value={email} onChange={e => setEmail(e.target.value)} required className="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)} required className="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Role</label>
                <div className="grid grid-cols-3 gap-2">
                  <button type="button" onClick={() => handleSelectRole('user')} className={`py-2 text-xs font-medium rounded-lg border ${role === 'user' ? 'bg-emerald-50 border-emerald-600 text-emerald-800 font-semibold' : 'bg-white'}`}>User</button>
                  <button type="button" onClick={() => handleSelectRole('flw')} className={`py-2 text-xs font-medium rounded-lg border ${role === 'flw' ? 'bg-teal-50 border-teal-600 text-teal-800 font-semibold' : 'bg-white'}`}>FLW</button>
                  <button type="button" onClick={() => handleSelectRole('admin')} className={`py-2 text-xs font-medium rounded-lg border ${role === 'admin' ? 'bg-purple-50 border-purple-600 text-purple-800 font-semibold' : 'bg-white'}`}>Admin</button>
                </div>
              </div>
              <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg text-sm mt-2 transition">
                Login
              </button>
            </form>
          </div>
        </div>
      );
    }

    // --- USER SCREENS ---
    function UserHomeScreen({ analyses, onNavigate }) {
      const verified = analyses.filter(a => a.status === 'Verified' || a.status === 'Corrected').length;
      const pending = analyses.filter(a => a.status === 'Pending' || a.status === 'Under Review').length;

      return (
        <div className="max-w-5xl mx-auto space-y-6">
          <div className="flex justify-between items-center pb-4 border-b border-slate-200">
            <div>
              <h1 className="text-2xl font-bold text-slate-900">Welcome, User 👋</h1>
              <p className="text-xs text-slate-500 mt-0.5">Overview of your animal breed analyses</p>
            </div>
            <button onClick={() => onNavigate('user/upload')} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
              Analyze New Image
            </button>
          </div>

          <div className="grid grid-cols-3 gap-4">
            <div className="bg-white border border-slate-200 p-4 rounded-xl text-center">
              <div className="text-2xl font-bold text-slate-900">{analyses.length}</div>
              <div className="text-xs font-semibold text-slate-500 mt-1 uppercase">Total Analyses</div>
            </div>
            <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-xl text-center">
              <div className="text-2xl font-bold text-emerald-700">{verified}</div>
              <div className="text-xs font-semibold text-emerald-800 mt-1 uppercase">Verified</div>
            </div>
            <div className="bg-amber-50 border border-amber-200 p-4 rounded-xl text-center">
              <div className="text-2xl font-bold text-amber-700">{pending}</div>
              <div className="text-xs font-semibold text-amber-800 mt-1 uppercase">Pending</div>
            </div>
          </div>

          <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
            <div className="px-6 py-3 border-b border-slate-100 flex justify-between items-center bg-slate-50">
              <h2 className="text-sm font-semibold text-slate-900">Recent Analyses</h2>
              <button onClick={() => onNavigate('user/history')} className="text-xs text-emerald-700 hover:underline">View All History →</button>
            </div>
            <table className="w-full text-left">
              <thead>
                <tr className="border-b text-xs text-slate-500 bg-slate-50">
                  <th className="p-3">Image</th>
                  <th className="p-3">Breed</th>
                  <th className="p-3">Confidence</th>
                  <th className="p-3">Status</th>
                  <th className="p-3 text-right">Action</th>
                </tr>
              </thead>
              <tbody className="divide-y text-sm">
                {analyses.slice(0, 4).map(a => (
                  <tr key={a.id} className="hover:bg-slate-50">
                    <td className="p-3"><img src={a.imageUrl} className="w-11 h-11 rounded-lg object-cover" /></td>
                    <td className="p-3 font-semibold">{a.predictedBreed} <span className="text-xs font-normal text-slate-500 block">{a.animalType}</span></td>
                    <td className="p-3 font-medium">{a.confidence}%</td>
                    <td className="p-3"><span className={`px-2 py-0.5 rounded-full text-xs font-medium ${a.status === 'Verified' ? 'badge-verified' : a.status === 'Corrected' ? 'badge-corrected' : 'badge-pending'}`}>{a.status}</span></td>
                    <td className="p-3 text-right"><button onClick={() => onNavigate('user/result', a.id)} className="text-xs font-semibold text-emerald-700 hover:underline">View</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function UserUploadScreen({ onNavigate, setAnalyses, showToast }) {
      const [preview, setPreview] = useState(null);
      const [analyzing, setAnalyzing] = useState(false);
      const [step, setStep] = useState(0);
      const [qualityReport, setQualityReport] = useState(null);
      const [earTag, setEarTag] = useState('');
      const fileRef = useRef(null);

      const handleFile = (file) => {
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setPreview(reader.result);
            setQualityReport({
              score: 94,
              grade: 'Optimal',
              sharpness: '95% (Clear)',
              lighting: 'Optimal (Sunlight)',
              contrast: '91%',
              resolution: '1280 × 960 px'
            });
          };
          reader.readAsDataURL(file);
        }
      };

      const handleAnalyze = async () => {
        setAnalyzing(true);
        setStep(0);
        await new Promise(r => setTimeout(r, 600));
        setStep(1);
        await new Promise(r => setTimeout(r, 700));
        setStep(2);
        await new Promise(r => setTimeout(r, 500));

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">

              <div className="p-3 bg-slate-50 rounded-lg border"><span className="text-[11px] text-slate-500 block">Email Address</span><span className="font-semibold text-sm truncate block">{user.email}</span></div>
              <div className="p-3 bg-slate-50 rounded-lg border"><span className="text-[11px] text-slate-500 block">Mobile Number</span><span className="font-semibold text-sm">{isFlw ? '+91 98234 56789' : isAdmin ? '+91 94000 11223' : '+91 98765 43210'}</span></div>
            </div>
          </div>

          {/* Section 2: Role Specific Scope */}
          {isUser && (
            <div>
              <h2 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Farm &amp; Livestock Scope</h2>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div className="p-3 bg-slate-50 rounded-lg border"><span className="text-[11px] text-slate-500 block">Dairy / Farm Name</span><span className="font-semibold text-sm">Patel Dairy &amp; Livestock Farm</span></div>
                <div className="p-3 bg-slate-50 rounded-lg border"><span className="text-[11px] text-slate-500 block">State &amp; District</span><span className="font-semibold text-sm">Gujarat, Anand District</span></div>
                <div className="p-3 bg-slate-50 rounded-lg border"><span className="text-[11px] text-slate-500 block">Registered Herd Size</span><span className="font-semibold text-sm text-emerald-700">28 Animals</span></div>
              </div>
            </div>
          )}

          {isFlw && (
            <div>
              <h2 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Official Verification Authority</h2>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div className="p-3 bg-slate-50 rounded-lg border"><span className="text-[11px] text-slate-500 block">Designation</span><span className="font-semibold text-sm">Senior Livestock Extension Officer</span></div>
                <div className="p-3 bg-slate-50 rounded-lg border"><span className="text-[11px] text-slate-500 block">Operating Zone</span><span className="font-semibold text-sm">Gujarat, Anand &amp; Kheda Zone</span></div>
                <div className="p-3 bg-slate-50 rounded-lg border"><span className="text-[11px] text-slate-500 block">Center Facility</span><span className="font-semibold text-sm">District Veterinary Polyclinic #4</span></div>
              </div>
            </div>
          )}

          {isAdmin && (
            <div>
              <h2 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">System &amp; Infrastructure Governance</h2>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div className="p-3 bg-slate-50 rounded-lg border"><span className="text-[11px] text-slate-500 block">Organization</span><span className="font-semibold text-sm">National Livestock AI Consortium</span></div>
                <div className="p-3 bg-slate-50 rounded-lg border"><span className="text-[11px] text-slate-500 block">Clearance</span><span className="font-semibold text-sm text-purple-800">Super Administrator (Level 4)</span></div>
                <div className="p-3 bg-slate-50 rounded-lg border"><span className="text-[11px] text-slate-500 block">Model Infrastructure</span><span className="font-semibold text-sm font-mono">VisionTransformer-v2.4</span></div>
              </div>
            </div>
          )}

          {/* Section 3: Performance / Stats */}
          <div>
            <h2 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Operational Activity</h2>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
              <div className="p-3 bg-slate-50 rounded-lg border"><div className="text-lg font-bold text-slate-900">{isFlw ? '148' : isAdmin ? '16' : '14'}</div><div className="text-[10px] text-slate-500 uppercase">{isFlw ? 'Cases Verified' : isAdmin ? 'Total Accounts' : 'Uploads'}</div></div>
              <div className="p-3 bg-emerald-50 rounded-lg border border-emerald-200"><div className="text-lg font-bold text-emerald-800">{isFlw ? '96.2%' : isAdmin ? '92.4%' : '11'}</div><div className="text-[10px] text-emerald-700 uppercase">{isFlw ? 'Agreement Rate' : isAdmin ? 'Model Accuracy' : 'Verified'}</div></div>
              <div className="p-3 bg-teal-50 rounded-lg border border-teal-200"><div className="text-lg font-bold text-teal-800">{isFlw ? '6' : isAdmin ? '5,420' : '3'}</div><div className="text-[10px] text-teal-700 uppercase">{isFlw ? 'Corrections' : isAdmin ? 'Dataset Images' : 'Pending'}</div></div>
              <div className="p-3 bg-slate-50 rounded-lg border"><div className="text-lg font-bold text-emerald-700">{isAdmin ? '99.98%' : 'Active'}</div><div className="text-[10px] text-slate-500 uppercase">{isAdmin ? 'Cluster Uptime' : 'Status'}</div></div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
